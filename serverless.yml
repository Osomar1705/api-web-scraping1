org: osmarvilchez
service: api-web-scraping

provider:
  name: aws
  runtime: python3.12
  memorySize: 1024
  timeout: 29   # API Gateway corta a los 29 s
  iam:
    role: arn:aws:iam::306288859368:role/LabRole
  environment:
    TABLE_NAME: TablaSismosIGP

package:
  patterns:
    - '!__MACOSX/**'
    - '!node_modules/**'
    - '!.serverless/**'

functions:
  scrape_table:
    handler: scrap_table.lambda_handler
    events:
      - http:
          path: /scrape/table
          method: get
          cors: true
          integration: lambda

resources:
  Resources:
    TablaSismosIGP:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TablaSismosIGP
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
